server:
  port: "8080"
  mode: "release"
database:
  mysql:
    dsn: "root:${RHA_E2E_PASSWORD}@tcp(mysql:3306)/RHA?charset=utf8mb4&parseTime=True&loc=Local"
  redis:
    addr: "redis:6379"
    password: "${RHA_E2E_PASSWORD}"
    db: 0
jwt:
  secret: "${RHA_E2E_JWT_SECRET}"
  access_token_expire_hours: 24
  refresh_token_expire_days: 7
log:
  level: "info"
  format: "json"
  output_path: ""
kafka:
  brokers: "kafka:29092"
  consumer_group_prefix: "rha-e2e"
  max_retries: 2
  base_backoff_ms: 100
  embedding_batch_size: 8
  es_bulk_batch_size: 100
  topics:
    parse: "file-parse"
    chunk: "file-chunk"
    embed: "file-embed"
    index: "file-index"
    dlq: "file-dlq"
minio:
  endpoint: "minio:9000"
  access_key_id: "${RHA_E2E_MINIO_USER}"
  secret_access_key: "${RHA_E2E_MINIO_PASSWORD}"
  use_ssl: false
  bucket_name: "uploads"
tika:
  server_url: "http://tika:9998"
elasticsearch:
  addresses: "http://es:9200"
  index_name: "rha-knowledge-active"
  index_generation: 2
embedding:
  model: "rha-fixture-embedding"
  base_url: "http://model-stub:8010"
  dimensions: 8
llm:
  base_url: "http://model-stub:8010/v1"
  model: "rha-fixture-chat"
  generation:
    temperature: 0
    top_p: 1
    max_tokens: 256
  prompt:
    rules: "Use only retrieved RHA fixture context."
    ref_start: "<<REF>>"
    ref_end: "<<END>>"
    no_result_text: "(no retrieval result)"
retrieval:
  bm25_topn: 20
  vector_topn: 20
  rrf_k: 60
  rerank_topn: 20
  final_topk: 5
  rerank_timeout_ms: 200
reranker:
  enabled: true
  base_url: "http://model-stub:8010/rerank"
  model: "rha-fixture-reranker"
memory:
  enabled: true
ai:
  orchestrator:
    enabled: true
    ingestion_enabled: true
    base_url: "http://orchestrator:8090"
    timeout_ms: 120000
    ingestion_timeout_ms: 120000
    shared_secret: "${RHA_E2E_INTERNAL_TOKEN}"
